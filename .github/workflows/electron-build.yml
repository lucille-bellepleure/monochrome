name: Electron Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            build_cmd: electron:build:mac
            artifact_name: mac-build
          - os: ubuntu-latest
            platform: linux
            build_cmd: electron:build:linux
            artifact_name: linux-build
          - os: windows-latest
            platform: win
            build_cmd: electron:build:win
            artifact_name: windows-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Python setuptools (for node-gyp on macOS)
        if: matrix.os == 'macos-latest'
        run: pip3 install --break-system-packages setuptools

      - name: Install dependencies
        run: bun install

      - name: Build Electron App
        run: bun run ${{ matrix.build_cmd }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Monochrome-${{ matrix.artifact_name }}
          path: release/
          retention-days: 30